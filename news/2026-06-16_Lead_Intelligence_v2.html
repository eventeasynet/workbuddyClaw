  <script>
    function showEmail(id) {
      var el = document.getElementById('email-' + id);
      if (el.style.display === 'none' || el.style.display === '') {
        el.style.display = 'block';
      } else {
        el.style.display = 'none';
      }
    }

    function saveEmail(id, lang) {
      var textarea = document.getElementById('email-' + lang + '-' + id);
      var key = 'email_' + lang + '_' + id;
      localStorage.setItem(key, textarea.value);
      alert('✅ ' + (lang === 'zh' ? '中文' : '英文') + '電郵已保存到本地！');
    }

    function translateEmail(id, btn) {
      var zhText = document.getElementById('email-zh-' + id).value;
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> AI 生成中...';

      // 呼叫 GAS API 進行翻譯
      var apiUrl = 'https://script.google.com/macros/s/AKfycbw_UeOLvsktIsdYEAHG2fJ2JxktsmdORGtnkEn4leyamj7fD602djoFexgrNNiCUDMv/exec';
      var params = 'action=translate&chineseText=' + encodeURIComponent(zhText) + '&context=' + encodeURIComponent('香港大學 2026 年畢業典禮');

      fetch(apiUrl + '?' + params)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          btn.disabled = false;
          btn.innerHTML = '🤖 AI 重新生成英文';
          
          if (data.success) {
            document.getElementById('email-en-' + id).value = data.englishText;
            alert('✅ 英文版本已重新生成！');
          } else {
            alert('❌ 生成失敗：' + data.error);
          }
        })
        .catch(function(error) {
          btn.disabled = false;
          btn.innerHTML = '🤖 AI 重新生成英文';
          alert('❌ 網絡錯誤：' + error);
        });
    }

    function sendEmail(id, recipient) {
      var zhText = document.getElementById('email-zh-' + id).value;
      var enText = document.getElementById('email-en-' + id).value;
      
      // 生成 mailto: 鏈接（打開 Gmail）
      var subject = 'Online Registration Platform Proposal';
      var body = '=== 繁體中文版本 ===\n\n' + zhText + '\n\n=== English Version ===\n\n' + enText;
      var mailtoUrl = 'mailto:' + recipient + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      
      // 打開默認郵件客戶端
      window.location.href = mailtoUrl;
    }

    function copyText(textareaId) {
      var textarea = document.getElementById(textareaId);
      textarea.select();
      try {
        var ok = document.execCommand('copy');
        if (ok) {
          alert('✅ 已複製到剪貼簿！');
        } else {
          alert('❌ 複製失敗，請手動選取文字後按 Ctrl+C');
        }
      } catch(e) {
        alert('❌ 複製失敗，請手動選取文字後按 Ctrl+C');
      }
    }
  </script>
